name: Weekly Data Refresh

# Compute-only org runner for the PRIVATE repo
# trinitylivy/comfy-templates. This PUBLIC repo gets unlimited Actions
# minutes — the trinitylivy account's runners are startup_failure-blocked
# account-wide (comfy-templates KNOWN_ISSUES #27; observed again
# 2026-09-09). All code + data live in the private repo, checked out at
# run time via the GH_PAT secret; nothing sensitive is ever committed
# here. Pattern: comfy-backend/comfy-sync-runner (proven hourly).
#
# Workload: the 8-step upstream data refresh (01-07 + verify, 100%
# Python stdlib, the path-portable work/comfy-templates/scripts/cron/
# daily_refresh.sh also used by the sandbox daemon) → 10-check audit →
# app consumption contract test (vitest, W2-c 2026-09-29) → race-scoped
# data commit pushed back to the private repo's main → post-push PROD
# VERIFICATION (the Vercel deploy is polled until the new built_at is
# live — a silent deploy failure now reds this run the same day, W2-c
# P2) → the connected Vercel project auto-deploys it.
#
# Commit identity: trinitylivy <trinitylivy@gmail.com> — Vercel's git
# integration has skipped deploys for other authors before (repo
# standing rule). Data commits do NOT use [skip ci] because the Vercel
# deploy of fresh data IS the point.
#
# Safety properties (mirrored from the in-repo weekly-refresh.yml):
#   * verify.py rc=1 is a soft pass; rc=2 or any step failure withholds
#     the stamp and the commit step never runs — partial data can never
#     land on main.
#   * the consumption contract test runs BEFORE the commit: data that
#     breaks the app's parsers is withheld, not shipped (W2-b P2-3).
#   * the commit is scoped strictly to pipeline outputs
#     (work/comfy-templates/data + public/data) — never `git add -A`.
#   * push is plain (never force); on a mid-run race it rebases and
#     retries 3 times, then fails loudly.
#
# ─── Cadence design ──────────────────────────────────────────
# GitHub's scheduler DROPS a large fraction of scheduled runs under
# platform load (observed 2026-09-06 on the hourly sync-runner: ~2/3).
# Two mechanisms guarantee weekly coverage:
#   1. The canonical Monday 16:00 UTC slot (09:00 PDT).
#   2. A Tuesday 17:07 UTC backstop (off-peak :07 convention).
# NOTE (W2-c 2026-09-29, corrected): the Tuesday run does NOT "exit
# clean with no changes" — every build re-stamps stats.json built_at,
# so each green run commits a small churn commit. That churn is the
# DESIGNED liveness heartbeat: it proves the pipeline (and the
# watchdog's built_at freshness signal) is alive even when upstream is
# static. Do NOT "fix" it by skipping the stamp.
# The sandbox's Thursday-09:00-PT daemon stays as the local fallback
# (it never commits; git is the disk).
#
# ─── Failure alerting (2026-09-27, AR3 D1) ───────────────────
# The 2026-09-21/22 PAT-death failures sat unnoticed for ~5 days:
# nothing alerted on a red scheduled run. The alert-failure step below
# opens (or comments on) ONE open issue labeled `data-refresh-alert`
# using the runner repo's OWN GITHUB_TOKEN — deliberately NOT GH_PAT,
# because the alert must fire exactly when GH_PAT is dead (the incident
# class). `cc @trinitylivy` subscribes the account (notifications fire
# on mentions even without watching the repo). The next green run
# auto-closes bot-created alerts. Timeout kills are covered via
# `failure() || cancelled()`. If THIS run is red but no alert issue
# exists, the alert step itself failed — check its logs (that state
# has no second alarm; W2-c P3 accepted).
#
# On failure the pipeline logs are uploaded as a run artifact (14-day
# retention) — the ephemeral runner would otherwise lose the only copy
# of WHY the refresh failed (W2-c P2).
#
# Secrets: GH_PAT (private checkout + push). This workflow never echoes
# secret values; GitHub auto-redacts registered ones in public logs.
# No pull_request triggers — fork PRs can never access secrets.

on:
  schedule:
    - cron: "0 16 * * 1" # Monday 16:00 UTC (09:00 PDT / 08:00 PST)
    - cron: "7 17 * * 2" # Tuesday backstop (17:07 UTC, off-peak)
  workflow_dispatch: {}

concurrency:
  group: weekly-refresh
  cancel-in-progress: false # never kill a refresh mid-scrape

# GH_PAT still does every private-repo write; the runner repo's own
# token gets issues:write ONLY for the alert steps (AR3 D1).
permissions:
  issues: write

jobs:
  refresh:
    name: Weekly upstream data refresh
    runs-on: ubuntu-latest
    timeout-minutes: 25 # pipeline ~3m + vitest ~3m + prod-verify up to ~6m
    steps:
      - name: Check configuration
        env:
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::GH_PAT secret not configured on this repo."
            exit 1
          fi

      - name: Check out private comfy-templates repo
        uses: actions/checkout@v4
        with:
          repository: trinitylivy/comfy-templates
          token: ${{ secrets.GH_PAT }}
          path: comfy-templates
          # Full history so the race-safe rebase below has a real
          # merge-base (~12 MiB pack).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 8-step refresh pipeline (01-07 + verify) and mirror to public/data
        working-directory: comfy-templates
        run: bash work/comfy-templates/scripts/cron/daily_refresh.sh

      - name: Post-refresh audit (10 structural checks, A-J)
        working-directory: comfy-templates
        run: python3 scripts/audit_refresh.py

      # ─── App consumption contract test (W2-b P2-3, 2026-09-29) ──────
      # Runs BEFORE the commit: a corpus that the app's parsers cannot
      # consume (shape drift the structural checks don't model, e.g. a
      # tags:null regression) must be WITHHELD, not shipped. The test
      # reads the real public/data files and runs them through
      # filterWorkflows / vramClass / workflowVramLabel.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: App consumption contract test (served corpus vs app parsers)
        working-directory: comfy-templates
        run: |
          bun install --frozen-lockfile --silent
          bunx vitest run tests/lib/public-data-consumption.test.ts --reporter=dot

      - name: Commit and push data changes (race-safe)
        id: push
        working-directory: comfy-templates
        run: |
          set -euo pipefail
          git config user.name "trinitylivy"
          git config user.email "trinitylivy@gmail.com"
          # Scope strictly to pipeline outputs: raw + unified data and
          # the static mirror the web app serves. Logs, pidfiles and
          # lock files also live under work/comfy-templates and must
          # never be committed.
          git add work/comfy-templates/data public/data
          if git diff --cached --quiet; then
            echo "No data changes — upstream static since the last run"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore(data): weekly upstream refresh $(date -u +%Y-%m-%d)"
          # NOTE: checkout@v4 leaves the runner on a DETACHED HEAD, so a
          # bare `git push` fails — push the explicit refspec HEAD:main
          # instead (empirically verified on this pattern).
          # A push to main during this run (parallel agent sessions are
          # active on this repo) makes ours non-fast-forward. NEVER
          # force-push — rebase on origin/main and retry a few times.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "data commit pushed (attempt ${attempt})"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "push attempt ${attempt} rejected — rebasing on origin/main, retrying"
              if ! git pull --rebase origin main; then
                echo "FATAL: rebase onto origin/main failed (conflict with a concurrent push?)"
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
            fi
          done
          echo "FATAL: could not push the data commit after 3 attempts"
          exit 1

      # ─── Post-push prod verification (W2-c P2-8, 2026-09-29) ────────
      # A green push does NOT mean prod serves the new data — the Vercel
      # deploy can fail silently (incl. the commit-author trap). Poll
      # prod's stats.json until its built_at matches the tree we just
      # pushed; a mismatch after ~6 minutes reds this run (the alert
      # step then fires the same day instead of the watchdog's 8-day
      # worst case).
      - name: Verify production deployment (post-push)
        working-directory: comfy-templates
        run: |
          set -euo pipefail
          expected="$(python3 -c "import json; print(json.load(open('public/data/stats.json'))['built_at'])")"
          echo "expecting prod built_at = ${expected}"
          for attempt in $(seq 1 30); do
            got="$(curl -sf --max-time 15 https://comfy-templates.vercel.app/data/stats.json \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('built_at',''))" 2>/dev/null || true)"
            if [ "${got}" = "${expected}" ]; then
              echo "prod verified: built_at ${got} live (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}: prod built_at = '${got:-unreachable}' — waiting for the Vercel deploy"
            sleep 12
          done
          echo "::error::prod does not serve built_at ${expected} after ~6 min — Vercel deploy failed or very slow (check the Vercel dashboard + the commit author rule)"
          exit 1

      # ─── GitLab mirror (redundant data backup, W15) ───────────────
      # GitHub is the primary disk; GitLab carries the second copy of
      # every data commit. Runs whenever the data push succeeded — even
      # if the prod-verify below reds (the commit still deserves its
      # mirror). Self-healing: re-pushing an up-to-date main is a no-op,
      # so this also catches up after any missed mirror. NEVER force
      # push — if GL ever diverges (it only ever receives fast-forwards)
      # the step reds loudly instead of overwriting. A red here pages
      # the same alert path as a pipeline failure: the backup contract
      # is part of the pipeline now (user directive 2026-09-30).
      - name: Mirror to GitLab (redundant data backup)
        id: glmirror
        if: ${{ !cancelled() && steps.push.conclusion == 'success' }}
        working-directory: comfy-templates
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          GL_REPO: ansgareutychisO/comfy-templates
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_PAT}" ]; then
            echo "::error::GITLAB_PAT secret not set — the GitLab mirror (redundant data backup) cannot run."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if git push "https://oauth2:${GITLAB_PAT}@gitlab.com/${GL_REPO}.git" HEAD:main 2>&1 | tee /tmp/glmirror.err; then
              echo "GitLab mirror OK (attempt ${attempt})"
              exit 0
            fi
            if grep -qE "HTTP Basic: Access denied|Authentication failed|401" /tmp/glmirror.err 2>/dev/null; then
              echo "::error::GitLab mirror got 401 — GITLAB_PAT is dead/rotted (deterministic; not retrying). Fix: set-secret.py on BOTH runner repos."
              exit 1
            fi
            echo "mirror attempt ${attempt} failed — retrying in 20s"
            sleep 20
          done
          echo "::error::GitLab mirror failed after 5 attempts — GitHub still has the data, but the redundant copy is stale: https://gitlab.com/${GL_REPO}"
          exit 1

      # ─── Netlify Blobs snapshot (tertiary data backup, W15) ────────
      # Third copy of the DATA LAYER (dated tar.gz, not git history) on
      # Netlify Blobs. Optional until the Netlify migration lands: skips
      # silently when the secrets are absent; a failure is a WARNING, not
      # a red run (promote to fatal when Blobs becomes load-bearing).
      - name: Snapshot data to Netlify Blobs (tertiary backup)
        id: blobs
        if: ${{ !cancelled() && steps.push.conclusion == 'success' && steps.push.outputs.pushed == 'true' }}
        working-directory: comfy-templates
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        continue-on-error: true   # warning-class, but the state must see a REAL failure (F3)
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "Netlify secrets not set — skipping the blobs snapshot (optional tertiary backup)"
            echo "result=skipped_no_secrets" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=attempted" >> "$GITHUB_OUTPUT"
          python3 work/comfy-templates/scripts/blobs_backup.py snapshot --keep 45

      - name: Runner-repo state (public observability; best-effort)
        if: ${{ !cancelled() }}   # F2: must record gl_mirror/blobs outcomes even on red runs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          RUNNER_REPO: comfy-backend/comfy-templates-runner
          GL_MIRROR: ${{ steps.glmirror.outcome }}
          BLOBS_SNAPSHOT: ${{ steps.blobs.outputs.result || steps.blobs.outcome }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          export TODAY="$today"
          python3 - << 'PYEOF' || echo "::warning::state commit failed (non-fatal)"
          import base64
          import json
          import os
          import urllib.request

          pat = os.environ["GH_PAT"]
          repo = os.environ["RUNNER_REPO"]
          today = os.environ["TODAY"]
          api = f"https://api.github.com/repos/{repo}/contents/state/last-run.json"

          def call(method, body=None):
              req = urllib.request.Request(
                  api, method=method, data=body,
                  headers={"Authorization": f"token {pat}",
                           "User-Agent": "comfy-templates-runner",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  return resp.status, (json.loads(raw) if raw else {})

          sha, existing_date = "", ""
          try:
              _, d = call("GET")
              sha = d.get("sha", "")
              content = base64.b64decode(d.get("content", "")).decode()
              existing_date = json.loads(content).get("date", "")
          except Exception:
              pass  # 404 on first run — create mode

          if existing_date == today:
              print(f"state/last-run.json already records {today} — skipping.")
              raise SystemExit(0)

          # Enriched payload (AR3 D1): prod-facing built_at + corpus size
          # so freshness is observable from the state file alone.
          built_at, corpus_total = "", None
          try:
              with open("comfy-templates/public/data/stats.json") as fh:
                  stats = json.load(fh)
              built_at = stats.get("built_at", "")
              corpus_total = stats.get("total_workflows")
          except Exception:
              pass  # first run / not built yet — keep the fields empty

          payload = {
              "date": today,
              "built_at": built_at,
              "corpus_total": corpus_total,
              "gl_mirror": os.environ.get("GL_MIRROR", ""),
              "blobs_snapshot": os.environ.get("BLOBS_SNAPSHOT", ""),
              "purpose": "public observability: last successful data-refresh run "
                         "(keeps GHA schedules alive + shows liveness of the weekly workload)",
          }
          body = json.dumps({
              "message": f"state: refresh ran on {today}",
              "content": base64.b64encode(
                  json.dumps(payload, indent=2).encode()).decode(),
          }).encode()
          if sha:
              body = json.loads(body.decode())
              body["sha"] = sha
              body = json.dumps(body).encode()
          call("PUT", body)
          print(f"state/last-run.json updated to {today}.")
          PYEOF

      # ─── Failure log preservation (W2-c P2, 2026-09-29) ─────────────
      # The ephemeral runner is the only place the refresh log exists
      # (daily_refresh.sh redirects pipeline output to a gitignored
      # file). Without this artifact a failed run tells you WHICH step
      # failed but never WHY.
      - name: Upload refresh logs (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-logs-${{ github.run_id }}
          path: |
            comfy-templates/work/comfy-templates/logs/
          retention-days: 14
          if-no-files-found: ignore

      # ─── Failure alerting (AR3 D1) ────────────────────────────────
      # Runs AFTER every other step so any failure (checkout/PAT death,
      # pipeline, audit, consumption test, push exhaustion, prod-verify,
      # timeout-kill) reaches it.
      - name: Alert on failure (open/comment alert issue)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_REPO: comfy-backend/comfy-templates-runner
          ALERT_LABEL: data-refresh-alert
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import datetime
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["RUNNER_REPO"]
          label = os.environ["ALERT_LABEL"]
          run_url = os.environ["RUN_URL"]
          marker = "<!-- bot: data-refresh-alert -->"
          cc = "cc @trinitylivy"

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.github.com{path}", method=method, data=body,
                  headers={"Authorization": f"token {token}",
                           "User-Agent": "comfy-templates-runner",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  return resp.status, (json.loads(raw) if raw else {})

          # The label must exist for label-filtered search to work.
          try:
              call("GET", f"/repos/{repo}/labels/{label}")
          except Exception:
              call("POST", f"/repos/{repo}/labels", json.dumps({
                  "name": label, "color": "d73a4a",
                  "description": "automated data-refresh failure alert",
              }).encode())

          _, issues = call(
              "GET", f"/repos/{repo}/issues?labels={label}&state=open")
          open_alerts = [i for i in issues if marker in (i.get("body") or "")]

          body_text = (
              f"{marker}\n"
              f"**Scheduled data refresh FAILED** — production data is now "
              f"stale until this is fixed.\n\n"
              f"- Run: {run_url}  (logs attached as a run artifact)\n"
              f"- Event: `{os.environ['EVENT_NAME']}`  |  "
              f"Job status: `{os.environ['JOB_STATUS']}`  |  "
              f"Attempt: `{os.environ['RUN_ATTEMPT']}`\n"
              f"- Time (UTC): {datetime.datetime.now(datetime.timezone.utc).isoformat()}\n\n"
              f"Open the run URL and read the first red step (check the "
              f"checkout step first — a dead/rotted `GH_PAT` secret fails "
              f"there, exactly like the 2026-09-21 incident; fix = "
              f"`set-secret.py` on BOTH runner repos).\n\n{cc}"
          )

          if not open_alerts:
              call("POST", f"/repos/{repo}/issues", json.dumps({
                  "title": "Data refresh FAILED — action required",
                  "body": body_text,
                  "labels": [label],
              }).encode())
              print("alert issue CREATED")
          else:
              # one comment per failed attempt on the single open alert
              call("POST",
                   f"/repos/{repo}/issues/{open_alerts[0]['number']}/comments",
                   json.dumps({"body": body_text}).encode())
              print(f"alert issue #{open_alerts[0]['number']} COMMENTED")
          PYEOF

      - name: Resolve alert on success (auto-close bot alerts)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_REPO: comfy-backend/comfy-templates-runner
          ALERT_LABEL: data-refresh-alert
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["RUNNER_REPO"]
          label = os.environ["ALERT_LABEL"]
          run_url = os.environ["RUN_URL"]
          marker = "<!-- bot: data-refresh-alert -->"

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.github.com{path}", method=method, data=body,
                  headers={"Authorization": f"token {token}",
                           "User-Agent": "comfy-templates-runner",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  return resp.status, (json.loads(raw) if raw else {})

          try:
              _, issues = call(
                  "GET", f"/repos/{repo}/issues?labels={label}&state=open")
          except Exception as e:
              print(f"label search failed (label may not exist yet): {e}")
              raise SystemExit(0)

          # Close ONLY bot-created alerts (marker in body) — never a
          # human note that happened to carry the label. If you reopen
          # a bot alert to track it manually, REMOVE the label first or
          # the next green run will close it again.
          closed = 0
          for issue in issues:
              if marker not in (issue.get("body") or ""):
                  continue
              call("POST",
                   f"/repos/{repo}/issues/{issue['number']}/comments",
                   json.dumps({"body": (
                       f"Recovered: green run {run_url} — alert auto-closed."
                   )}).encode())
              call("PATCH", f"/repos/{repo}/issues/{issue['number']}",
                   json.dumps({"state": "closed"}).encode())
              closed += 1
          print(f"resolved {closed} alert issue(s)")
          PYEOF
